<div class="offwork family citems" [class.rest]="isRest">
  <div class="title">
    {{ isRest ? data['restTitle'] : data['workTitle'] }}
  </div>
  @if (!isRest) {
    <div class="coutdown">{{ countdownStr }}</div>
  }
  @if (isRest) {
    <img
      src="https://gcore.jsdelivr.net/gh/xjh22222228/public@gh-pages/nav/rest.svg"
      class="img"
      />
  } @else {
    <img
      src="https://gcore.jsdelivr.net/gh/xjh22222228/public@gh-pages/nav/rest.svg"
      class="img"
      />
  }
</div>
