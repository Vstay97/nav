<label [id]="id" class="file">
  @if (!uploading) {
    <i
      nz-icon
      nzType="upload"
      nzTheme="outline"
      class="cursor-pointer"
      [title]="$t('_upload')"
    ></i>
  }
  @if (uploading) {
    <i nz-icon [nzType]="'loading'"></i>
  }
  <input
    type="file"
    [name]="id"
    (change)="onChangeFile($event)"
    accept="image/*"
    class="file-upload"
    />
</label>
