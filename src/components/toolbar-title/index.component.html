@if (dataSource && dataSource.title) {
  <div
    class="title tool-title dark-primary dark-border-color"
    >
    <span class="cursor-pointer" (click)="onCollapse.emit()">
      <i
        class="iconfont iconjiantouarrow483 down-arrow"
        [class.active]="dataSource.collapsed"
        >
      </i>
      <span style="margin-left: 10px; align-self: center; vertical-align: middle">
        {{ dataSource.title }} x {{ dataSource.nav.length }}
      </span>
    </span>
    @if (isLogin) {
      <i
        nz-icon
        nzType="plus"
        nzTheme="outline"
        class="add-icon"
        (click)="openCreateWebModal()"
        >
      </i>
    }
  </div>
}
