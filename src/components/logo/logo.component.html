@if (src) {
  <img
    [src]="src"
    class="icon common-icon"
  [ngStyle]="{
    width: size === 0 ? '' : size + 'px',
    height: size === 0 ? '' : size + 'px',
    minWidth: size + 'px',
    minHeight: size + 'px',
    borderRadius: radius + 'px'
  }"
    draggable="false"
    loading="lazy"
    [alt]="name ? name[0] : ''"
    />
} @else {
  <div
    class="circle common-icon"
    [ngStyle]="{
      width: size === 0 ? '' : size + 'px',
      height: size === 0 ? '' : size + 'px',
      minWidth: size + 'px',
      minHeight: size + 'px'
    }"
    >
    {{ name ? name[0] : '' }}
  </div>
}
