@if (fetchIng) {
  <div class="fetchIng flex-center">
    <nz-spin nzSimple [nzSize]="'large'"></nz-spin>
  </div>
} @else {
  <div id="xiejiahe">
    @if (fxAuroraVisible) {
      <app-effects-layer></app-effects-layer>
    }
    @if (fxCursorGlowVisible) {
      <app-cursor-glow></app-cursor-glow>
    }
    <app-icon-git></app-icon-git>
    <router-outlet></router-outlet>
    <app-create-web />
    @if (isLogin) {
      <app-move-web />
    }
  </div>
}
