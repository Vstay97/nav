# 仓库地址，填写 Fork 后的仓库地址，支持 Gitee / GitHub
gitRepoUrl: https://github.com/Vstay97/nav

# Fork 部署分支
branch: main

# 只有GitHub pages用户需要设置为true， 其他建议设置为 false
hashMode: false

# Worker 抓取代理地址（见 worker/ 目录；留空则关闭自动抓取，手动填写图标/标题）
# 本地联调: http://localhost:8787 ；部署后改为 Worker 正式域名
workerUrl: ''

# 收录通知邮箱
email: ''

# 默认主仓库，当仓库作为私密，上传的图片是无法访问的，需要转移到公开仓库
imageRepoUrl: 'https://github.com/Vstay97/nav?branch=images'
